name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: fmt, clippy, tests (core + cli)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p rewind-core -p rewind-cli --all-targets -- -D warnings
      - run: cargo test -p rewind-core -p rewind-cli

  windows:
    name: build everything on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
