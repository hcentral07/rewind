  linux:
    # Ubuntu 22.04 keeps the binaries runnable on older distributions (older glibc)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev libssl-dev patchelf

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build CLI
        run: cargo build --release -p rewind-cli

      - name: Build desktop app (.deb)
        working-directory: rewind-gui
        run: cargo tauri build --bundles deb

      - name: Build desktop app (AppImage, best effort)
        continue-on-error: true
        working-directory: rewind-gui
        env:
          NO_STRIP: "true"
        run: cargo tauri build --bundles appimage

      - name: Stage files
